[pytest]
# ---------------------------------------------------------------------------
# pytest configuration for the Flask "Hello, World!" application test suite
# ---------------------------------------------------------------------------
# This file controls test discovery, execution settings, and output formatting.
# It ensures pytest only discovers tests in the tests/ directory (avoiding
# unrelated files such as test.py - Copy.txt and other artifacts at the root)
# and applies consistent naming conventions and verbose output by default.
# ---------------------------------------------------------------------------

# Restrict test discovery to the tests/ directory only.
# Without this, pytest may pick up unrelated files matching test patterns
# (e.g., test.py - Copy.txt, test.py.txt) in the repository root.
testpaths = tests

# Standard naming conventions for test file discovery.
python_files = test_*.py

# Standard naming convention for test class discovery.
python_classes = Test*

# Standard naming convention for test function discovery.
python_functions = test_*

# Default command-line options applied to every pytest invocation:
#   -v          : Verbose output showing individual test names and results
#   --tb=short  : Short traceback format for concise failure reporting
addopts = -v --tb=short

# ---------------------------------------------------------------------------
# Custom marker definitions for test categorization.
# Use these markers to selectively run subsets of the test suite, e.g.:
#   pytest -m unit          — run only unit tests
#   pytest -m integration   — run only integration tests
#   pytest -m edge_cases    — run only edge-case tests
#   pytest -m "not slow"    — exclude slow tests
# ---------------------------------------------------------------------------
markers =
    unit: Unit tests for isolated component validation
    integration: Integration tests for full request-response cycle
    edge_cases: Edge case and boundary condition tests
    error_handling: Error scenario and unsupported method tests
    config: Server configuration and startup validation tests
    slow: Tests that may take longer than average to execute
